<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTCS - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .login-box {
            width: 380px;
            padding: 40px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
            color: #1677ff;
        }

        .logo p {
            margin-top: 8px;
            color: #888;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1677ff;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1677ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0958d9;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            min-height: 20px;
            color: #ff4d4f;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>TTCS Panel</h1>
        <p>V2Ray Management Panel</p>
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit">Login</button>

        <div id="message"></div>

    </form>

</div>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        message.textContent = "";

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {
                message.style.color = "#52c41a";
                message.textContent = "Login successful!";
		setTimeout(() => {
       			 window.location.href = "/dashboard";
   			 }, 500);
            } else {
                message.style.color = "#ff4d4f";
                message.textContent = data.message;
            }

        } catch (error) {
            message.style.color = "#ff4d4f";
            message.textContent = "Cannot connect to server.";
        }
    });
</script>

</body>
</html>
